  if (e.key === 'Enter') { e.preventDefault(); H.dlgOk(); }
  else if (e.key === 'Escape') H.dlgNo();
});
// 點數字欄位時全選，方便直接改
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.draft) setTimeout(() => e.target.select(), 0); });
// 瀏覽器規定要使用者操作後才能出聲
document.addEventListener('pointerdown', () => audio(), {passive: true});

$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.logs) || !(Array.isArray(data.custom) || Array.isArray(data.exercises))) throw new Error('格式不符');
    // 合併檔：只加進新的動作和紀錄，不動到現有資料
    if (data.merge) {
      const haveEx = new Set(S.custom.map(x => x.id)), haveLog = new Set(S.logs.map(x => x.id));
      const nc = (data.custom || []).filter(x => !haveEx.has(x.id)), nl = data.logs.filter(x => !haveLog.has(x.id));
      if (!await ask(`要加入 ${nl.length} 組紀錄、${nc.length} 個動作？\n現有的 ${S.logs.length} 組紀錄會保留。`)) return;
      S.custom.push(...nc); S.logs.push(...nl); save(); refreshEx(); for (const k in draft) delete draft[k];
      showTab('train'); toast(`已加入 ${nl.length} 組紀錄`); return;
    }
    const np = Array.isArray(data.photos) ? data.photos.length : 0;
    if (!await ask(`匯入的備份有 ${data.logs.length} 組紀錄${np ? `、${np} 張照片` : ''}。\n匯入會覆蓋目前的資料（${S.logs.length} 組），確定？`)) return;
    const {photos, ...rest} = data;
    S = normalize(rest); save(); refreshEx(); open.clear(); for (const k in draft) delete draft[k];
    if (np) { await pTx('readwrite', s => { s.clear(); photos.forEach(p => s.put(p)); }); await loadPhotos(); }
    showTab('train'); toast('匯入完成');
  } catch (err) { note('匯入失敗：' + err.message); }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (T.end) { tick(); wake(true); closeNotes(); }
  if (S.today.date !== dstr()) { ensureToday(); render(); }
});

$('#nx-part').innerHTML = PARTS.map(p => `<option>${p}</option>`).join('');
$('#nx-equip').innerHTML = EQUIPS.map(p => `<option>${p}</option>`).join('');
$('#nx-muscle').innerHTML = '<option value="">（不指定）</option>' + Object.entries(MUSCLES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
open.add('s:unit'); open.add('s:rest'); open.add('s:aid'); open.add('s:backup');
ensureToday();
if (S.today.exIds.length) open.add(S.today.exIds.find(id => !todaySets(id).length) || S.today.exIds[0]);
render();
// 開場畫面：圓環 7 段 = 本週 7 天，有練的那天亮起
(function splash() {
  const el = $('#splash'); if (!el) return;
  const now = new Date(), dow = (now.getDay() + 6) % 7, dates = new Set(S.logs.map(l => l.date));
  const R = 100, gap = 9, seg = 360 / 7, pt = a => [R * Math.cos((a - 90) * Math.PI / 180), R * Math.sin((a - 90) * Math.PI / 180)].map(v => v.toFixed(2));
  let n = 0, svg = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + i), on = dates.has(dstr(d));
    if (on) n++;
    const a0 = i * seg + gap / 2, a1 = (i + 1) * seg - gap / 2, [x0, y0] = pt(a0), [x1, y1] = pt(a1);
    const [tx, ty] = [(R + 24) * Math.cos(((a0 + a1) / 2 - 90) * Math.PI / 180), (R + 24) * Math.sin(((a0 + a1) / 2 - 90) * Math.PI / 180)];
    svg += `<path class="${on ? 'on' : 'off'}" pathLength="1" style="animation-delay:${80 + i * 70}ms" d="M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}"/>`
      + `<text class="${i === dow ? 't' : ''}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}">${'一二三四五六日'[i]}</text>`;
  }
  $('#sp-ring').innerHTML = svg;
  $('#sp-n').innerHTML = `${n}<small>/7</small>`;
  $('#sp-word').innerHTML = [...'健身紀錄'].map((c, i) => `<i style="animation-delay:${.45 + i * .07}s">${c}</i>`).join('');
  const M = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'], W = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  $('#sp-eb').innerHTML = `<em>${W[now.getDay()]}</em> · ${now.getDate()} ${M[now.getMonth()]} ${now.getFullYear()}`;
  let gone = false;
  const go = () => { if (gone) return; gone = true; el.classList.add('out'); setTimeout(() => el.remove(), 800); };
  el.addEventListener('click', go);
  setTimeout(go, matchMedia('(prefers-reduced-motion:reduce)').matches ? 400 : 1700);
})();
loadPhotos();
resumeTimer();
if (STORE_OK) askPersist();
// 讓網頁可以安裝成 App，並在沒網路時也能打開
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
